# Site
site_name: iNKraft
site_author: Jeff Retz
site_description: High-quality, production-ready Kotlin projects for every platform.
site_url: https://datlag.dev

# Copyright
copyright: Copyright &copy; Jeff Retz – <a href="#__consent">Change cookie settings</a>

# Extra
extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/iN-Kraft
    - icon: fontawesome/brands/patreon
      link: https://www.patreon.com/c/datlag
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jeff-retz/
  tags:
    Android: android
    JVM: jvm
    Linux: linux
    Apple: apple
    MacOS: macos
    Web: web
    Windows: windows
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - reject
      - manage
    cookies:
      adsense:
        name: Google AdSense (Personalized Ads)
        checked: false
      analytics:
        name: Site Analytics
        checked: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/consent.js

# Extensions
markdown_extensions:
  - attr_list
  - tables
  - admonition
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - docs/overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      permalink: "#"
  - md_in_html
  - pymdownx.blocks.caption

# Plugins
plugins:
  - tags

# Navigation
nav:
  - Home:
      - index.md
  - About:
      - Overview: about/
      - Setup: about/setup.md
      - License: about/license.md
      - Privacy Policy: privacy.md
      - Contact: contact.md
      - Terms of Service: terms.md
  - Projects:
      - Cache:
          - Overview: projects/cache/index.md
          - InMemory: projects/cache/core.md
          - File: projects/cache/file.md
          - Ktor: projects/cache/ktor.md
      - Kotlin Native Interface:
          - Overview: projects/kni/index.md
          - Buffers: projects/kni/buffers.md
          - "Arrays & Utilities": projects/kni/utils.md
      - Locale:
          - Overview: projects/locale/index.md
          - "Countries & Continents": projects/locale/countries.md
          - "Serialization & Features": projects/locale/features.md
      - NanoId: projects/nanoid.md
      - Shadow Enum: projects/shadow-enum.md
  - Sponsors:
      - Overview: sponsors/
      - Access management: sponsors/access.md
      - "Payment & Billing": sponsors/payment.md
      - Privacy: sponsors/privacy.md
      - "Runtime & Cancellation": sponsors/runtime.md
  - Articles:
      - Error Handling: articles/kotlin-error-handling.md

# Theme
theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/ico/favicon-48x48.ico
  logo: assets/logo.webp
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  font:
    text: Manrope
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - search.highlight
  icon:
    repo: fontawesome/brands/github
    tag:
      android: material/android
      jvm: material/language-java
      linux: material/linux
      apple: material/apple
      macos: material/apple
      web: fontawesome/brands/js-square
      windows: material/microsoft-windows
